# /etc/wsl.conf — per-distro WSL settings for this Ubuntu install.
# Managed by the cli repo: this is the source of truth. Edit here, then run
# bootstrap.zsh (or the sudo install below) to deploy, and `wsl.exe --shutdown`
# from Windows for changes to take effect. It is COPIED to /etc, not symlinked:
# WSL ignores wsl.conf on a world-writable path, which a /mnt/c symlink is.
#
# The Windows-global counterpart (%USERPROFILE%\.wslconfig: memory, networking)
# lives in the dotfiles repo at windows/wsl/.wslconfig.

[boot]
systemd=true

[user]
# Machine-specific: the default login user for this distro.
default=asapvw

[interop]
enabled=true
appendWindowsPath=true
